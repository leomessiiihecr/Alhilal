<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>جوال الزعيم</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#fff;--dim:#b9c6e6;--gold:#e2b857;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;user-select:none}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:radial-gradient(120% 60% at 85% 12%,#1c3fa8 0%,transparent 60%),linear-gradient(170deg,#08245e,#020b22 62%,#0a1233)}
.sb{display:flex;justify-content:space-between;padding:12px 26px 0;font-weight:600;font-size:15px;z-index:2}
#lock{z-index:5;transition:transform .5s cubic-bezier(.7,0,.2,1)}
#lock.up{transform:translateY(-105%)}
.date{text-align:center;margin-top:8px;font-size:19px;font-weight:600;color:#e4ecff}
.clock{text-align:center;font-size:min(34vw,150px);font-weight:700;line-height:1.05;background:linear-gradient(#fff,#b4c3ec);-webkit-background-clip:text;background-clip:text;color:transparent}
.lost{text-align:center;margin:10px 20px 14px}
.lost b{display:block;font-size:20px}
.lost span{font-size:15px;color:var(--dim)}
.notes{flex:1;overflow-y:auto;padding:0 14px;display:flex;flex-direction:column;gap:8px}
.n{display:flex;gap:12px;align-items:center;background:rgba(18,24,44,.78);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:12px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.n i{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:20px;background:#2d62d6}
.n i.wa-ic{background:#25d366}
.n div{flex:1;min-width:0;font-size:14px;line-height:1.45}
.n strong{display:block;font-size:15px}
.n time{font-size:12px;color:var(--dim);align-self:flex-start}
.bot{display:flex;align-items:center;justify-content:space-between;padding:12px 28px 6px}
.cb{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.12);border:0;color:#fff;display:grid;place-items:center;font-size:20px;cursor:pointer}
.sw{background:none;border:0;color:#9db0dd;font:inherit;font-size:16px;cursor:pointer;padding:12px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
.bar{width:36%;height:5px;border-radius:3px;background:#fff;margin:6px auto 10px;cursor:pointer}

/* شاشة رمز القفل Passcode */
#passcode{z-index:6;background:rgba(4,12,34,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#passcode.on{display:flex}
.pc-title{font-size:20px;font-weight:600;margin-bottom:18px}
.dots{display:flex;gap:18px;margin-bottom:34px;direction:ltr}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff;transition:background .15s}
.dot.fill{background:#fff}
.dots.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:18px 24px;direction:ltr}
.key{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.14);border:0;color:#fff;font:inherit;font-size:30px;font-weight:400;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.key:active{background:rgba(255,255,255,.35)}
.pc-bot{display:flex;justify-content:space-between;width:276px;margin-top:26px;font-size:16px}
.pc-bot button{background:none;border:0;color:#fff;font:inherit;cursor:pointer;padding:8px}

/* الشاشة الرئيسية */
#home{z-index:1}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px;padding:28px 16px 0;align-content:start;flex:1}
.app{background:none;border:0;color:#fff;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative}
.ic{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;font-size:28px;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.bd{position:absolute;top:-6px;right:-8px;background:#ff453a;border-radius:99px;min-width:22px;height:22px;padding:0 5px;font-size:12px;display:grid;place-items:center;font-weight:700}
.wid{grid-column:span 2;grid-row:span 2;background:#1c1c1e;border-radius:24px;overflow:hidden;text-align:right;cursor:pointer}
.wid h4{background:#f5d547;color:#2a2200;padding:10px 14px;font-size:16px}
.wid p{padding:12px 14px;color:#9a9aa2;font-size:13px;line-height:1.6}
.wid b{display:block;color:#fff;font-size:15px;margin-bottom:4px}
.dock{margin:0 12px 10px;background:rgba(60,60,70,.55);backdrop-filter:blur(15px);border-radius:32px;padding:12px;display:flex;justify-content:space-around}
.srch{align-self:center;background:rgba(60,60,70,.6);padding:8px 20px;border-radius:99px;font-size:14px;color:#cfd6ea;margin-bottom:14px}

/* النوافذ والتطبيقات المفتوحة */
.ov{position:fixed;inset:0;z-index:8;background:#000;display:none;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.ov.on{display:flex}
.ov header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 10px;border-bottom:1px solid #1c1c1e}
.ov h2{font-size:24px}
.back{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}

/* الكاميرا */
#cam{z-index:10}
.ct{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;color:#ffd60a;font-size:14px}
#cv{flex:1;width:100%;background:#111}
.cm{display:flex;justify-content:center;gap:18px;padding:12px;color:#fff;font-size:14px}.cm b{color:#ffd60a}
.sh{display:flex;justify-content:space-around;align-items:center;padding:6px 0 18px}
.sh span{width:48px;height:48px;border-radius:12px;background:#222;display:grid;place-items:center;font-size:20px}
#shut{width:72px;height:72px;border-radius:50%;background:#fff;border:4px solid #000;outline:3px solid #fff;cursor:pointer}

/* الطرفية Terminal */
#term{background:#000;font-family:ui-monospace,Menlo,monospace;direction:ltr;z-index:10}
.tt{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#8e8e93;font-size:13px;border-bottom:1px solid #222}
.sc{flex:1;overflow-y:auto;padding:14px 16px;font-size:14px;line-height:1.7;color:#eee}.g{color:#5ad86a}
#ti{background:none;border:0;color:#fff;font:inherit;outline:0;width:55%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;border-top:1px solid #222}
.chips button{flex:none;background:#1c1c1e;color:#eee;border:0;border-radius:99px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}

/* المنبه */
#alarm{background:radial-gradient(80% 40% at 50% 22%,#46321a,#0f0f0f 70%);align-items:center;padding:0 22px;z-index:14}
.al{margin-top:20vh;color:#e5e5e5;font-size:22px;font-weight:600}
.ac{font-size:min(28vw,120px);font-weight:700}
.ab{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:12px;padding-bottom:10vh}
.ab button{height:68px;border:0;border-radius:99px;font:inherit;font-size:22px;font-weight:700;cursor:pointer}
.snz{background:#f2a53c;color:#1a1000}.stp{background:#333;color:#fff}

/* الملفات */
#files{background:#000}
.fh{flex:1;overflow-y:auto;padding:16px 20px}
.fs{background:#1c1c1e;border-radius:12px;padding:10px 14px;color:#8e8e93;margin-bottom:14px;font-size:14px}
.fr{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #1c1c1e;cursor:pointer}
.fr b{display:block;font-size:17px;font-weight:500;direction:ltr;text-align:right}
.fr small{color:#8e8e93;font-size:13px}
.fi{flex:none;width:50px;height:50px;border-radius:10px;display:grid;place-items:center;background:#2c2c2e;color:#fff;font-size:12px;font-family:monospace}
.fi.lk{background:#2a1414;border:1px solid #6b2a2a;font-size:22px}
.fi.fd{background:none;font-size:38px}

/* الواتساب */
.chat-row{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid #1c1c1e;cursor:pointer}
.av{width:48px;height:48px;border-radius:50%;background:#1e4d9b;display:grid;place-items:center;font-size:20px;flex:none}
.chat-info{flex:1;min-width:0}
.chat-info b{display:flex;justify-content:space-between;font-size:16px}
.chat-info span{color:#8e8e93;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{background:#25d366;color:#000;font-weight:700;font-size:12px;border-radius:99px;padding:2px 7px}

/* الإعدادات */
.set-card{background:#1c1c1e;border-radius:14px;margin:14px 18px;overflow:hidden}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #2c2c2e;font-size:15px}
.set-row:last-child{border-bottom:0}

/* شاشة المكالمة الواردة */
#call{background:radial-gradient(circle at 50% 25%,#1a2a4a,#090d16 75%);z-index:15;align-items:center;justify-content:space-between;padding:12vh 30px 10vh}
.caller{text-align:center}
.caller h1{font-size:34px;margin-bottom:6px}
.caller p{color:#9db0dd;font-size:18px}
.call-btns{display:flex;width:100%;justify-content:space-around}
.cbtn{width:74px;height:74px;border-radius:50%;border:0;font-size:30px;color:#fff;cursor:pointer;display:grid;place-items:center}
.dec{background:#ff3b30}.acc{background:#34c759;animation:ring 1s infinite}
@keyframes ring{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* إشعار علوي منبثق + تنبيه سفلي */
